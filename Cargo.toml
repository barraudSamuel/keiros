[package]
name = "kairos"
version = "0.1.0"
edition = "2021"
description = "Local time-based source history for a project, independent of Git"
license = "MIT"
readme = "README.md"
keywords = ["backup", "history", "restore", "cli", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
diffy = "0.4"
ignore = "0.4"
notify = "6.1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
similar = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
